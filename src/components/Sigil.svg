<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <filter id='marble' x='0%' y='0%' width='100%' height='100%'>
    <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="5" stitchTiles="stitch" result="turbulence"/>
    <feBlend mode="multiply" in="SourceGraphic" in2="turbulence"/>
  </filter>

  <mask id="cutout">
    <rect x="0" y="0" width="100" height="100" fill="white" />
    <circle cx="50" cy="40" r="40" fill="black" />
  </mask>
  <mask id="lower">
    <rect x="0" y="0" width="100" height="100" fill="white" />
    <circle cx="25" cy="70" r="10" fill="black" />
    <circle cx="45" cy="85" r="10" fill="black" />
    <circle cx="65" cy="100" r="10" fill="black" />
  </mask>

  <polygon filter="url(#marble)" class="sigilhover" points="10 10 90 10 90 20 10 20" fill="#800000" />
  <path filter="url(#marble)" class="sigilhover" d="M10 20 h20 v20 h-20z" fill="#800000" mask="url(#cutout)" />
  <path filter="url(#marble)" class="sigilhover" d="M80 20 h10 v20 h-10z" fill="#800000" mask="url(#cutout)" />
  <polygon filter="url(#marble)" class="sigilhover" points="25 20 25 70 35 70 35 20" fill="#800000" mask="url(#lower)" />
  <polygon filter="url(#marble)" class="sigilhover" points="45 20 45 85 55 85 55 20" fill="#800000" mask="url(#lower)" />
  <polygon filter="url(#marble)" class="sigilhover" points="65 20 65 200 75 200 75 20" fill="#800000" mask="url(#lower)" />
</svg>
